# PasswordAuthentication is set at start (entrypoint.sh), from DEV_PASSWORD.
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers dev
# The root-owned list from AUTHORIZED_KEYS, plus ~/.ssh/authorized_keys for apps that add
# their own key (the herdr app does). Agents can write the second one too.
AuthorizedKeysFile /etc/ssh/authorized_keys/%u .ssh/authorized_keys
# For commands run without a login shell, e.g. the herdr app's `hc connect`.
SetEnv PATH=/home/dev/.local/bin:/home/dev/.local/share/mise/shims:/usr/local/bin:/usr/bin:/bin
HostKey /etc/ssh/keys/ssh_host_ed25519_key
