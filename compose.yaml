name: devbox

services:
  devbox:
    build:
      context: .
      args:
        DEV_UID: ${DEV_UID:-99}
        DEV_GID: ${DEV_GID:-100}
    # Build on every `up`, so a redeploy picks up Dockerfile changes even without --build.
    pull_policy: build
    hostname: devbox
    init: true
    # For lanblock.sh's rules in the box's own network namespace; dev has no root, so can't use it.
    cap_add: [NET_ADMIN]
    networks: [devbox]
    # Public resolvers: a LAN or Tailscale DNS server would be blocked.
    dns: [1.1.1.1, 9.9.9.9]
    ports:
      - "2222:22"
      - "60000-60010:60000-60010/udp"
      # The herdr PWA, plain HTTP: point your reverse proxy (with TLS and WebSockets) at it.
      - "${PWA_PORT:-8787}:8787"
    environment:
      # Your SSH public key(s); separate several with ";". Set this, DEV_PASSWORD, or both.
      AUTHORIZED_KEYS: ${AUTHORIZED_KEYS:-}
      # Optional: also allow logging in as dev with this password.
      DEV_PASSWORD: ${DEV_PASSWORD:-}
    volumes:
      # Host folders next to the stack, so everything big lands on the host disk, not in Docker's storage.
      - ${DEVBOX_DATA:-./data}/home:/home/dev
      - ${DEVBOX_DATA:-./data}/hostkeys:/etc/ssh/keys
      - ${DEVBOX_DATA:-./data}/tmp:/tmp
      # Optional host folders, at /mnt/1-3 in the box: set MOUNT_1 to a host path (MOUNT_1_MODE=ro: read only).
      # Unset, a slot is an empty folder, ./data/mnt/N.
      - ${MOUNT_1:-./data/mnt/1}:/mnt/1:${MOUNT_1_MODE:-rw}
      - ${MOUNT_2:-./data/mnt/2}:/mnt/2:${MOUNT_2_MODE:-rw}
      - ${MOUNT_3:-./data/mnt/3}:/mnt/3:${MOUNT_3_MODE:-rw}
    cpus: 4
    mem_limit: 8g
    pids_limit: 4096
    restart: unless-stopped

networks:
  devbox:
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${DEVBOX_SUBNET:-172.30.99.0/24}
