name: devbox

services:
  lanblock:
    build:
      context: .
      # Baked in rather than mounted: a stack manager's clone path may not exist on the host.
      dockerfile_inline: |
        FROM alpine:3.22
        RUN apk add --no-cache iptables iptables-legacy
        COPY lanblock.sh /lanblock.sh
    network_mode: host
    cap_add: [NET_ADMIN]
    init: true
    environment:
      SUBNET: ${DEVBOX_SUBNET:-172.30.99.0/24}
    command: sh /lanblock.sh
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 2s
    restart: unless-stopped

  devbox:
    build:
      context: .
      args:
        DEV_UID: ${DEV_UID:-99}
        DEV_GID: ${DEV_GID:-100}
    hostname: devbox
    init: true
    # shortcut: compose waits for the rules on `up`, but after a host reboot Docker restarts both at once; the gap is seconds with only sshd running.
    depends_on:
      lanblock: { condition: service_healthy }
    networks: [devbox]
    # Public resolvers: a LAN or Tailscale DNS server would be blocked.
    dns: [1.1.1.1, 9.9.9.9]
    ports:
      - "2222:22"
      - "60000-60010:60000-60010/udp"
    environment:
      # Your SSH public key(s); separate several with ";".
      AUTHORIZED_KEYS: ${AUTHORIZED_KEYS:?set AUTHORIZED_KEYS to your SSH public key}
    volumes:
      # Host folders next to the stack, so everything big lands on the host disk, not in Docker's storage.
      - ${DEVBOX_DATA:-./data}/home:/home/dev
      - ${DEVBOX_DATA:-./data}/hostkeys:/etc/ssh/keys
      - ${DEVBOX_DATA:-./data}/tmp:/tmp
    cpus: 4
    mem_limit: 8g
    pids_limit: 4096
    restart: unless-stopped

networks:
  devbox:
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${DEVBOX_SUBNET:-172.30.99.0/24}
